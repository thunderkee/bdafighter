<!doctype html>
<html><head><meta charset="UTF-8" /><title>models</title><style>html,body{margin:0;background:#2a3550;height:100%;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { ShooterMesh, characterById } from '/src/robot.ts';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') ?? 'angel,dragon,pioneer,liberty,monoceros,baron,bastion,nightshade,violet,kabuto,tyrant,rex,liger,ember').split(',');
const view = q.get('view') ?? 'angle';
const W = +(q.get('w') ?? 1400), H = +(q.get('h') ?? 520);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(W, H); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3550);
scene.add(new THREE.HemisphereLight(0xdfe4ff, 0x2a1d4a, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 1.9); sun.position.set(-4, 12, -6); scene.add(sun);
const cols = +(q.get('cols') ?? 7);
ids.forEach((id, i) => { const d = characterById(id); const s = new ShooterMesh(id, d.ball, d); const c = i % cols, row = Math.floor(i / cols); s.root.position.set((c - (cols - 1) / 2) * 2.1, -row * 2.4, 0); scene.add(s.root); });
const rows = Math.ceil(ids.length / cols);
const w = cols * 2.1 * 1.02; const a = H / W;
const hh = Math.max((w / 2) * a, rows * 1.25);
const ww = hh / a;
const cam = new THREE.OrthographicCamera(-ww, ww, hh, -hh, 0.1, 100);
const d = { angle: [-0.7, 0.3, -1], front: [0, 0.1, -1], back: [0.2, 0.25, 1], side: [-1, 0.1, 0] }[view];
const cy = 1 - (rows - 1) * 1.2;
cam.position.set(d[0] * 10, cy + d[1] * 10, d[2] * 10); cam.lookAt(0, cy, 0); r.render(scene, cam);
window.__shot = async (name) => (await fetch(`http://127.0.0.1:8799/?name=${name}`, { method: 'POST', body: r.domElement.toDataURL('image/jpeg', 0.88) })).status;
</script></body></html>
